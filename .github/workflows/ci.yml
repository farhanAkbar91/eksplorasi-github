name: Basic CI Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Validation Step
        run: |
          echo "CI Pipeline started..."
          echo "Checking files..."
          test -f README.md && echo "README.md exists!"
          echo "All CI checks completed successfully."